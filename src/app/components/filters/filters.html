<aside class="filters">
  <header class="filters-header">
    <h3>Filters</h3>
    <span class="count" aria-live="polite">{{ selectedConfigs().length }} of {{ totalConfigs() }} configurations</span>
  </header>

  <div class="actions">
    <button type="button" (click)="selectAll()">Select all</button>
    <button type="button" (click)="deselectAll()">Clear</button>
  </div>

  @for (section of sections(); track section.dimension) {
    <section class="group">
      <div class="group-header">
        <h4>{{ section.title }}</h4>
        <span class="group-actions">
          <button type="button" (click)="setDimension(section.dimension, true)">all</button>
          <button type="button" (click)="setDimension(section.dimension, false)">none</button>
        </span>
      </div>
      <div class="options">
        @for (option of section.options; track option.value) {
          <label class="option">
            <input type="checkbox" [checked]="isOn(section.dimension, option.value)" (change)="toggle(section.dimension, option.value)" />
            {{ option.label }}
          </label>
        }
      </div>
    </section>
  }

  <section class="group">
    <div class="group-header">
      <h4>Metrics</h4>
      <span class="group-actions">
        <button type="button" (click)="setMetrics(true)">all</button>
        <button type="button" (click)="setMetrics(false)">none</button>
      </span>
    </div>
    <div class="options">
      @for (metric of metrics; track metric) {
        <label class="option">
          <input type="checkbox" [checked]="selectedMetrics().includes(metric)" (change)="toggleMetric(metric)" />
          {{ metric }}
        </label>
      }
    </div>
  </section>
</aside>
